name: Knowledge graph validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate graph integrity
        run: node scripts/validate-knowledge-graph.js
      - name: Run knowledge graph tests
        run: node --test tests/knowledge-graph.test.js tests/knowledge-api.test.js
